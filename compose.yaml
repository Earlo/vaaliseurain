services:
  dashboard:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      VAALIRAIVO_DATA_DIR: /app/runtime
      DASHBOARD_EDIT_TOKEN: ${DASHBOARD_EDIT_TOKEN:-}
      SOURCE_REFRESH_ENABLED: ${SOURCE_REFRESH_ENABLED:-true}
      SOURCE_REFRESH_INTERVAL_MS: ${SOURCE_REFRESH_INTERVAL_MS:-300000}
    volumes:
      - vaaliraivo-data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vaaliraivo-data:
